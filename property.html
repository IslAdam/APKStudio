<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали домика - Caspian Villas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="index.html" class="logo">⌂ Caspian Villas</a>
            </div>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Главная</a></li>
                <li><a href="catalog.html" class="nav-link">Каталог</a></li>
                <li><a href="about.html" class="nav-link">О нас</a></li>
                <li><a href="employees.html" class="nav-link">Сотрудники</a></li>
                <li><a href="index.html#contacts" class="nav-link">Контакты</a></li>
            </ul>
        </div>
    </nav>

    <!-- Контент -->
    <section class="property-detail">
        <div class="container">
            <div class="back-link">
                <a href="catalog.html">← Назад в каталог</a>
            </div>

            <div class="property-grid">
                <div class="property-gallery">
                    <a id="mainImageLink" class="main-image" href="assets/image/main.jpg" target="_blank" rel="noopener" aria-label="Открыть изображение в большом размере">
                        <img id="mainImage" src="assets/image/main.jpg" alt="Фото дома" />
                    </a>
                    <div class="gallery-thumbs" id="galleryThumbs">
                        <img class="thumb" src="assets/image/main.jpg" alt="Миниатюра дома 1" />
                        <img class="thumb" src="assets/image/main.jpg" alt="Миниатюра дома 2" />
                        <img class="thumb" src="assets/image/main.jpg" alt="Миниатюра дома 3" />
                    </div>
                </div>

                <div class="property-sidebar">
                    <div id="propertyContent">
                        <!-- Контент подгружается JavaScript -->
                    </div>
                </div>
            </div>

            <div class="property-section">
                <h2>Описание</h2>
                <p id="fullDescription">
                    Загружается...
                </p>
            </div>

            <div class="property-section">
                <h2>Удобства</h2>
                <div class="amenities-grid" id="amenities">
                    <!-- Контент подгружается JavaScript -->
                </div>
            </div>

            <div class="property-section">
                <h2>Информация</h2>
                <div class="info-grid" id="infoGrid">
                    <!-- Контент подгружается JavaScript -->
                </div>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Caspian Villas. Все права защищены.</p>
        </div>
    </footer>

    <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
        <button class="close-btn" id="lightboxClose" aria-label="Закрыть большое изображение">×</button>
        <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Предыдущее изображение">‹</button>
        <img id="lightboxImage" src="" alt="" />
        <button class="lightbox-nav next" id="lightboxNext" aria-label="Следующее изображение">›</button>
    </div>
    <script src="js/script.js"></script>
    <script src="js/property.js"></script>
</body>
</html>
